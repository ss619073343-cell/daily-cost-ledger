<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日用成本簿</title><style>
:root{--bg:#07141c;--card:#10242c;--line:#294248;--ink:#eaf4f5;--muted:#a7bdc0;--mint:#93e0ca}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#1d4547,transparent 34rem),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}.wrap{max-width:1100px;margin:auto;padding:40px 20px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:26px}.tag{color:var(--mint);font-weight:800;letter-spacing:.12em;font-size:12px}h1{font-size:42px;letter-spacing:-2px;margin:4px 0}p{color:var(--muted);margin:0}.btn{background:var(--mint);color:#06201e;border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px}.stat{padding:18px}.stat span,.small{color:var(--muted);font-size:13px}.stat b{display:block;font-size:28px;margin-top:5px}.panel{overflow:hidden}.bar{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between}.bar input,.bar select,input,select{background:#07161c;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 10px}.bar input{min-width:220px}.row{display:grid;grid-template-columns:45px 1.4fr 1fr 1fr 32px;gap:14px;align-items:center;padding:16px;border-bottom:1px solid #20383e}.ico{font-size:22px}.name{font-weight:750}.daily b{color:var(--mint)}.del{border:0;background:none;color:#91a9ac;font-size:22px;cursor:pointer}.empty{padding:55px;text-align:center;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:16px;background:#0d2028;color:var(--ink);width:min(480px,90vw)}dialog::backdrop{background:#000a}form{padding:18px}form h2{margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:grid;gap:5px;color:var(--muted);font-size:13px}.actions{margin-top:18px;display:flex;justify-content:end;gap:8px}.cancel{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 13px}@media(max-width:650px){header{display:block}.btn{margin-top:16px;width:100%}.stats{grid-template-columns:1fr}.bar{display:block}.bar input{width:100%;margin-bottom:8px}.row{grid-template-columns:34px 1fr 25px}.row .cost,.row .daily{grid-column:2}.row .daily{grid-row:3}.row .del{grid-column:3;grid-row:1}.fields{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header><div><div class="tag">DAILY COST LEDGER</div><h1>日用成本簿</h1><p>用得越久，每一天越划算。</p></div><button class="btn" onclick="dlg.showModal()">＋ 记录新物品</button></header><section class="stats"><div class="stat"><span>累计购入</span><b id="sum">¥0</b></div><div class="stat"><span>正在使用</span><b id="num">0 件</b></div><div class="stat"><span>今日平均花费</span><b id="avg">¥0.00 / 天</b></div></section><section class="panel"><div class="bar"><input id="q" oninput="render()" placeholder="搜索物品名称…"><select id="f" onchange="render()"><option value="">所有类型</option></select></div><div id="list"></div></section></main><dialog id="dlg"><form id="form"><h2>记录一件物品</h2><div class="fields"><label class="full">物品名称<input id="n" required placeholder="例如：Sony WH-1000XM5"></label><label>类型<select id="t"><option>手机 / 平板</option><option>电脑 / 配件</option><option>相机 / 影像</option><option>耳机 / 音响</option><option>游戏 / 娱乐</option><option>智能穿戴</option><option>家电</option><option>家具 / 家居</option><option>工具 / 出行</option><option>其他</option></select></label><label>购入价格（元）<input id="p" required type="number" min="0.01" step="0.01"></label><label class="full">购入日期<input id="d" required type="date"></label></div><div class="actions"><button type="button" class="cancel" onclick="dlg.close()">取消</button><button class="btn">保存物品</button></div></form></dialog><script>
const K='daily-cost-ledger',ico={'手机 / 平板':'📱','电脑 / 配件':'💻','相机 / 影像':'📷','耳机 / 音响':'🎧','游戏 / 娱乐':'🎮','智能穿戴':'⌚','家电':'⚡','家具 / 家居':'🪑','工具 / 出行':'🧰','其他':'✦'};let a=JSON.parse(localStorage.getItem(K)||'[]');d.value=new Date().toISOString().slice(0,10);const day=x=>Math.max(1,Math.floor((Date.now()-new Date(x+'T00:00:00'))/864e5)+1),m=x=>'¥'+Number(x).toLocaleString('zh-CN',{maximumFractionDigits:2});function render(){let type=f.value,ts=[...new Set(a.map(x=>x.t))];f.innerHTML='<option value="">所有类型</option>'+ts.map(x=>'<option '+(x==type?'selected':'')+'>'+x+'</option>').join('');let z=a.filter(x=>(!type||x.t==type)&&x.n.toLowerCase().includes(q.value.toLowerCase()));sum.textContent=m(a.reduce((s,x)=>s+x.p,0));num.textContent=a.length+' 件';avg.textContent=m(a.reduce((s,x)=>s+x.p/day(x.d),0))+' / 天';list.innerHTML=z.length?z.sort((x,y)=>y.p/day(y.d)-x.p/day(x.d)).map(x=>'<div class="row"><div class="ico">'+ico[x.t]+'</div><div><div class="name">'+x.n+'</div><div class="small">'+x.t+' · 购入于 '+x.d+'</div></div><div class="cost"><span class="small">购入价格</span><b>'+m(x.p)+'</b></div><div class="daily"><span class="small">已使用 '+day(x.d)+' 天 · 日均</span><b>'+m(x.p/day(x.d))+'/天</b></div><button class="del" onclick="del(''+x.id+'')">×</button></div>').join(''):'<div class="empty">还没有记录，从第一件心爱之物开始。</div>'}function del(id){a=a.filter(x=>x.id!=id);localStorage.setItem(K,JSON.stringify(a));render()}form.onsubmit=e=>{e.preventDefault();a.push({id:crypto.randomUUID(),n:n.value,t:t.value,p:+p.value,d:d.value});localStorage.setItem(K,JSON.stringify(a));form.reset();d.value=new Date().toISOString().slice(0,10);dlg.close();render()};render();
</script></body></html>
